AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  MovieLogger base resources (ADR-016): VPC, subnets, security groups, ECR repositories, the frontend
  bucket and log groups. Nothing here bills by the hour.

Parameters:
  CloudFrontPrefixListId:
    Type: String
    Description: >-
      ID of the com.amazonaws.global.cloudfront.origin-facing managed prefix list in this region
      (aws ec2 describe-managed-prefix-lists).
    AllowedPattern: "^pl-[0-9a-f]+$"

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: movielogger }]

  # Needed for the Fargate task's outbound traffic, and required by CloudFront VPC origins.
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: movielogger }]

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Public subnets: only the API and migration tasks, which need a public IP for outbound traffic
  # (no NAT gateway). Their security groups accept no inbound traffic from the internet.
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: movielogger-public-a }]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: movielogger-public-b }]

  # Private subnets: the internal load balancer and the database. No route to the internet.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: movielogger-private-a }]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: movielogger-private-b }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: movielogger-public }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: movielogger-private }]

  PrivateSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MovieLogger internal load balancer - HTTP from CloudFront only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront origin-facing
      Tags: [{ Key: Name, Value: movielogger-alb }]

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MovieLogger API task - port 8080 from the load balancer only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: Internal load balancer
      Tags: [{ Key: Name, Value: movielogger-api }]

  MigratorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MovieLogger migration task - no inbound traffic
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: movielogger-migrator }]

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MovieLogger database - SQL Server from the API and migration tasks only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 1433
          ToPort: 1433
          SourceSecurityGroupId: !Ref ApiSecurityGroup
          Description: API task
        - IpProtocol: tcp
          FromPort: 1433
          ToPort: 1433
          SourceSecurityGroupId: !Ref MigratorSecurityGroup
          Description: Migration task
      Tags: [{ Key: Name, Value: movielogger-db }]

  # Images are rebuilt from source, so the repositories may be emptied when the stack is deleted.
  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: movielogger-api
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EmptyOnDelete: true
      # Each push is an image index plus untagged child manifests (image, provenance attestation), so count
      # tagged images only. ECR never expires a child while its index exists; rule 2 clears orphaned ones.
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep the last 5 tagged images","selection":{"tagStatus":"tagged","tagPatternList":["*"],"countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}},{"rulePriority":2,"description":"Expire untagged images no longer referenced by an index","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":1},"action":{"type":"expire"}}]}

  MigratorRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: movielogger-migrator
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep the last 5 tagged images","selection":{"tagStatus":"tagged","tagPatternList":["*"],"countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}},{"rulePriority":2,"description":"Expire untagged images no longer referenced by an index","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":1},"action":{"type":"expire"}}]}

  # Private; CloudFront reads it through origin access control (bucket policy in app.yml).
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /movielogger/api
      RetentionInDays: 7

  MigratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /movielogger/migrator
      RetentionInDays: 7

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: "movielogger:VpcId" }
  PublicSubnetIds:
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
    Export: { Name: "movielogger:PublicSubnetIds" }
  PrivateSubnetIds:
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
    Export: { Name: "movielogger:PrivateSubnetIds" }
  LoadBalancerSecurityGroupId:
    Value: !Ref LoadBalancerSecurityGroup
    Export: { Name: "movielogger:LoadBalancerSecurityGroupId" }
  ApiSecurityGroupId:
    Value: !Ref ApiSecurityGroup
    Export: { Name: "movielogger:ApiSecurityGroupId" }
  MigratorSecurityGroupId:
    Value: !Ref MigratorSecurityGroup
    Export: { Name: "movielogger:MigratorSecurityGroupId" }
  DatabaseSecurityGroupId:
    Value: !Ref DatabaseSecurityGroup
    Export: { Name: "movielogger:DatabaseSecurityGroupId" }
  ApiRepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
    Export: { Name: "movielogger:ApiRepositoryUri" }
  MigratorRepositoryUri:
    Value: !GetAtt MigratorRepository.RepositoryUri
    Export: { Name: "movielogger:MigratorRepositoryUri" }
  SiteBucketName:
    Value: !Ref SiteBucket
    Export: { Name: "movielogger:SiteBucketName" }
  SiteBucketRegionalDomainName:
    Value: !GetAtt SiteBucket.RegionalDomainName
    Export: { Name: "movielogger:SiteBucketRegionalDomainName" }
  SiteBucketArn:
    Value: !GetAtt SiteBucket.Arn
    Export: { Name: "movielogger:SiteBucketArn" }
