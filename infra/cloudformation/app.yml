AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  MovieLogger application (ADR-016): internal load balancer, ECS Fargate API service, the one-off
  migration task definition, and the CloudFront distribution serving the frontend and /api/*.
  Bills by the hour while it exists. Requires the base and database stacks, the images in ECR, and the
  SecureString parameters /movielogger/api-connection-string, /movielogger/jwt-key,
  /movielogger/db-admin-password and /movielogger/db-app-password.

Parameters:
  ApiImageTag:
    Type: String
  MigratorImageTag:
    Type: String
  # Start at 0, run the migration task, then raise to 1, so the API never runs against an empty database.
  ApiDesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]
  RegistrationEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: movielogger
      ClusterSettings: [{ Name: containerInsights, Value: disabled }]

  # Used by ECS to pull images, write logs and inject the SecureString parameters. The containers
  # themselves get no AWS permissions (no task role).
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-movielogger-parameters
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/movielogger/*

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internal
      Subnets: !Split [",", !ImportValue "movielogger:PrivateSubnetIds"]
      SecurityGroups: [!ImportValue "movielogger:LoadBalancerSecurityGroupId"]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !ImportValue "movielogger:VpcId"
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /health
      Matcher: { HttpCode: "200" }
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  # ASPNETCORE_HTTPS_PORT is deliberately unset (docs/deployment.md): CloudFront terminates TLS.
  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: movielogger-api
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Sub
            - "${Repo}:${ApiImageTag}"
            - Repo: !ImportValue "movielogger:ApiRepositoryUri"
          Essential: true
          PortMappings: [{ ContainerPort: 8080, Protocol: tcp }]
          Environment:
            - { Name: ForwardedHeaders__ForwardLimit, Value: "2" }
            - { Name: Registration__Enabled, Value: !Ref RegistrationEnabled }
          Secrets:
            - Name: ConnectionStrings__MovieLoggerDb
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/movielogger/api-connection-string
            - Name: Jwt__Key
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/movielogger/jwt-key
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /movielogger/api
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  # Run on demand with `aws ecs run-task` (infra/README.md); never as a service.
  MigratorTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: movielogger-migrator
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "1024"
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: migrator
          Image: !Sub
            - "${Repo}:${MigratorImageTag}"
            - Repo: !ImportValue "movielogger:MigratorRepositoryUri"
          Essential: true
          Environment:
            - { Name: DB_HOST, Value: !ImportValue "movielogger:DatabaseEndpoint" }
            - { Name: DB_ADMIN_USER, Value: !ImportValue "movielogger:DatabaseMasterUsername" }
          Secrets:
            - Name: DB_ADMIN_PASSWORD
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/movielogger/db-admin-password
            - Name: APP_DB_PASSWORD
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/movielogger/db-app-password
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /movielogger/migrator
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: migrator

  # Public subnet with a public IP for outbound traffic only; the security group admits just the load balancer.
  ApiService:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: movielogger-api
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !Ref ApiDesiredCount
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [",", !ImportValue "movielogger:PublicSubnetIds"]
          SecurityGroups: [!ImportValue "movielogger:ApiSecurityGroupId"]
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn: !Ref ApiTargetGroup

  VpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: movielogger-api
        Arn: !Ref LoadBalancer
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: movielogger-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Client-side routes (no file extension) get index.html. Done here rather than with custom error
  # responses, which would also replace the API's own 403/404 responses.
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: movielogger-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for client-side routes
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: MovieLogger
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        DefaultRootObject: index.html
        ViewerCertificate: { CloudFrontDefaultCertificate: true }
        Origins:
          - Id: site
            DomainName: !ImportValue "movielogger:SiteBucketRegionalDomainName"
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: !GetAtt LoadBalancer.DNSName
            VpcOriginConfig: { VpcOriginId: !GetAtt VpcOrigin.Id }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !ImportValue "movielogger:SiteBucketName"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub
              - "${BucketArn}/*"
              - BucketArn: !ImportValue "movielogger:SiteBucketArn"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  SiteUrl:
    Value: !Sub https://${Distribution.DomainName}
  DistributionId:
    Value: !Ref Distribution
  ClusterName:
    Value: !Ref Cluster
