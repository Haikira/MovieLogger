# Local development configuration for the Flyway CLI.
#
# Uses SQL Server Windows Integrated Authentication against the same local instance EF Core's
# runtime connection string targets (see server/src/MovieLogger.Api/appsettings.json). No username/password
# is configured here because integrated auth carries no credential to store.
#
# NOTE: on a non-domain-joined machine, JDBC integrated auth requires the native
# mssql-jdbc_auth-<version>-x64.dll on the system PATH (see docs/migrations.md for details and a
# fallback if this proves troublesome locally).

flyway.url=jdbc:sqlserver://localhost;databaseName=MovieLoggerDb;integratedSecurity=true;trustServerCertificate=true;
flyway.locations=filesystem:database/migrations
flyway.baselineOnMigrate=false
